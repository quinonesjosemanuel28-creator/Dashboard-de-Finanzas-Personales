<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sin conexión · Patrimonio</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fafafa; color: #1e2638; padding: 24px; text-align: center; }
      @media (prefers-color-scheme: dark) { body { background: #141824; color: #f4f4f5; } }
      button { margin-top: 16px; font: inherit; padding: 12px 20px; border-radius: 10px; border: 0; background: #1e2638; color: #fff; }
      @media (prefers-color-scheme: dark) { button { background: #f4f4f5; color: #1e2638; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Estás sin conexión</h1>
      <p>Patrimonio necesita internet para mostrarte tus datos. Revisá la conexión y probá de nuevo.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
